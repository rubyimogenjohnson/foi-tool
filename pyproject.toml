[tool.poetry]
package-mode = false

[project]
name = "foi-tool"
version = "0.1.0"
description = "Natural language search over Camden FOI responses"
authors = [
    {name = "Ruby Johnson", email = "rubyjohnson@hotmail.co.uk"}
]
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "anthropic>=0.40",
    "fastapi>=0.100",
    "uvicorn>=0.30",
    "flask>=3.0",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "onnxruntime>=1.14,<1.24",
    "markdown (>=3.10.2,<4.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
